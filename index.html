<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cel-Quest 3D: Tomb of the Ancients</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #040508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-card { background: rgba(10, 14, 23, 0.88); border: 2px solid #00f0ff; border-radius: 10px; padding: 15px; color: #fff; width: 280px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); pointer-events: auto; }
        .hp-bar-bg { width: 100%; height: 18px; background: #2a0808; border-radius: 9px; border: 1px solid #ff3300; overflow: hidden; margin-top: 6px; }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff1a00, #ff6600); transition: width 0.2s ease; }
        .xp-bar-bg { width: 100%; height: 8px; background: #08222a; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .xp-bar-fill { width: 0%; height: 100%; background: #00f0ff; transition: width 0.2s ease; }
        
        #level-up-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 5, 10, 0.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; color: white; }
        .modal-title { font-size: 28px; color: #00f0ff; text-shadow: 0 0 12px #00f0ff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .modal-subtitle { font-size: 14px; color: #aaa; margin-bottom: 25px; }
        .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 700px; width: 90%; }
        .skill-card { background: #0f1626; border: 2px solid #1a2942; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .skill-card:hover { border-color: #00f0ff; transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0, 240, 255, 0.4); }
        .skill-icon { font-size: 36px; margin-bottom: 10px; }
        .skill-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .skill-desc { font-size: 12px; color: #8a9ba8; }

        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(0,240,255,0.4); border-radius: 60px; pointer-events: auto; display: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #00f0ff; border-radius: 25px; box-shadow: 0 0 10px #00f0ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="hud-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="player-class-title" style="font-weight:bold; color:#00f0ff;">РЫЦАРЬ</span>
                <span id="player-lvl" style="font-size:12px; background:#00f0ff; color:#000; padding:2px 6px; border-radius:4px; font-weight:bold;">УР. 1</span>
            </div>
            <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div>
            <div class="xp-bar-bg"><div id="xp-fill" class="xp-bar-fill"></div></div>
            <div style="margin-top:10px; font-size:11px; color:#8a9ba8; display:flex; justify-content:space-between;">
                <span>Управление: WASD / Сенсор</span>
                <span id="floor-indicator">ЭТАЖ 1/3</span>
            </div>
        </div>
    </div>

    <div id="level-up-modal">
        <div class="modal-title">НОВЫЙ УРОВЕНЬ ДОСТИГНУТ!</div>
        <div class="modal-subtitle">Выберите улучшение для дальнейшего прохождения гробницы</div>
        <div class="skills-grid">
            <div class="skill-card" onclick="selectSkill('atk')">
                <div class="skill-icon">⚔️</div>
                <div class="skill-name">Заточенные Клинки</div>
                <div class="skill-desc">+25% к урону</div>
            </div>
            <div class="skill-card" onclick="selectSkill('speed')">
                <div class="skill-icon">⚡</div>
                <div class="skill-name">Порыв Ветра</div>
                <div class="skill-desc">+20% к скорости</div>
            </div>
            <div class="skill-card" onclick="selectSkill('vamp')">
                <div class="skill-icon">🩸</div>
                <div class="skill-name">Жатва Душ</div>
                <div class="skill-desc">+15% вампиризма</div>
            </div>
        </div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script>
        // Генерация текстурного атласа прямо в памяти браузера (без внешних файлов и CORS ошибок)
        function createDynamicArmorAtlas() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Металлическая броня
            ctx.fillStyle = '#7a8b9e'; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#3a4a5e'; ctx.lineWidth = 12; ctx.strokeRect(20, 20, 472, 472);
            
            // Герб на грудь (Красный грифон/щит)
            ctx.fillStyle = '#cc2222'; ctx.beginPath(); ctx.arc(256, 256, 120, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(256, 256, 40, 0, Math.PI*2); ctx.fill();
            
            // Ткань мантии и руны
            ctx.fillStyle = '#4a2574'; ctx.fillRect(512, 0, 512, 512);
            ctx.fillStyle = '#00f0ff';
            for(let i = 600; i < 950; i += 80) {
                ctx.fillRect(i, 100, 30, 60);
            }
            
            // Кожаные элементы
            ctx.fillStyle = '#5c3a21'; ctx.fillRect(0, 512, 512, 512);
            ctx.fillStyle = '#2b1b0f'; ctx.fillRect(512, 512, 512, 512);

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040508);
        scene.fog = new THREE.FogExp2(0x040508, 0.035);

        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(-12 * aspect, 12 * aspect, 12, -12, 0.1, 1000);
        camera.position.set(20, 22, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x99bbff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(15, 30, 10);
        scene.add(dirLight);

        // Применяем сгенерированный процедурный атлас
        const customMat = new THREE.MeshToonMaterial({ map: createDynamicArmorAtlas() });

        const player = new THREE.Group();
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.6, 0.8), customMat);
        bodyMesh.position.y = 1.2;
        player.add(bodyMesh);

        const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), customMat);
        headMesh.position.y = 2.3;
        player.add(headMesh);

        const swordGroup = new THREE.Group();
        const bladeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.4, 0.3), customMat);
        bladeMesh.position.y = 0.7;
        swordGroup.add(bladeMesh);
        swordGroup.position.set(0.8, 1.2, 0.3);
        player.add(swordGroup);

        scene.add(player);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshToonMaterial({ color: 0x1a2233 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        let playerStats = { hp: 100, maxHp: 100, xp: 0, maxXp: 100, lvl: 1, atk: 25, speed: 0.18, vamp: 0 };
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if(e.key === ' ') attack();
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function attack() {
            swordGroup.rotation.x = -Math.PI / 2;
            setTimeout(() => { swordGroup.rotation.x = 0; }, 150);
            
            playerStats.xp += 35;
            document.getElementById('xp-fill').style.width = (playerStats.xp / playerStats.maxXp * 100) + '%';
            if(playerStats.xp >= playerStats.maxXp) {
                playerStats.xp = 0;
                playerStats.lvl++;
                document.getElementById('player-lvl').innerText = 'УР. ' + playerStats.lvl;
                document.getElementById('level-up-modal').style.display = 'flex';
            }
        }

        function selectSkill(type) {
            if(type === 'atk') playerStats.atk *= 1.25;
            if(type === 'speed') playerStats.speed *= 1.2;
            if(type === 'vamp') playerStats.vamp += 0.15;
            document.getElementById('level-up-modal').style.display = 'none';
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let moveX = 0, moveZ = 0;
            if (keys['w'] || keys['ц']) moveZ -= 1;
            if (keys['s'] || keys['ы']) moveZ += 1;
            if (keys['a'] || keys['ф']) moveX -= 1;
            if (keys['d'] || keys['в']) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                let len = Math.hypot(moveX, moveZ);
                player.position.x += (moveX / len) * playerStats.speed;
                player.position.z += (moveZ / len) * playerStats.speed;
                player.rotation.y = Math.atan2(moveX, moveZ);
                player.position.y = Math.abs(Math.sin(clock.getElapsedTime() * 10)) * 0.1;
            }

            camera.position.x = player.position.x + 20;
            camera.position.z = player.position.z + 20;
            renderer.render(scene, camera);
        }

        if('ontouchstart' in window) {
            document.getElementById('joystick-zone').style.display = 'block';
        }

        animate();
    </script>
</body>
</html>
